name: Pages

# Publishes the marketing site in `site/` to GitHub Pages
# (https://dmux.github.io/minilake/). Requires the repository's Pages source to
# be set to "GitHub Actions" -- Settings -> Pages -> Build and deployment.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/render_contributors.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "0 6 * * 1" # weekly, so the contributors list stays current
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Render contributors
        run: python3 scripts/render_contributors.py ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
